<script>
  // Preview page: the hosted engine running on its own (no StreamElements). ?lang=es|pt-PT|de|fr
  var q = new URLSearchParams(location.search);
  window.DUCK_REACTOR_OPTIONS = { useSaved: false };
  window.addEventListener("duckreactor:ready", function () {
    var s = window.duckReactor.store, l = q.get("lang");
    var sets = [["chat.auto.enabled", true], ["chat.auto.calm", 45], ["chat.recovery.selfResolve", true]];
    if (l) sets.push(["memes.lang", l]);
    s.setMany(sets, { source: "preview" });
  });
</script>
